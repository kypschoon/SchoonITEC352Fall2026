<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Things Equal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #fbf9fc; color: #1c1c1e; }
        header { background: #3d0c5a; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; margin-right: 1.5rem; text-decoration: none; font-weight: bold; }
        main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
        .btn { display: inline-block; background: #3d0c5a; color: white; padding: 0.8rem 1.5rem; border-radius: 8px; text-decoration: none; margin: 0.5rem; }
        .btn:hover { background: #5d1887; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.75rem; text-align: left; }
        th { background: #3d0c5a; color: white; }
        .success { background: #d4edda; color: #155724; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        input, textarea, select { width: 100%; padding: 0.6rem; margin: 0.4rem 0 1rem; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 style="margin:0;">All Things Equal</h1>
            <nav style="margin-top: 0.5rem;">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'about' %}">About</a>
                <a href="{% url 'pricing' %}">Pricing</a>
                <a href="{% url 'reviews' %}">Reviews</a>
                <a href="{% url 'quote' %}">Request Quote</a>
            </nav>
        </div>
        <div>
            <a href="/admin/" class="btn" style="background:#5d1887; margin:0;">Create Account / Sign In</a>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
