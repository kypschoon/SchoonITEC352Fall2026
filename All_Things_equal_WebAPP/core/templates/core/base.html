{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Things Equal</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
    <header>
        <div>
            <img src="{% static 'core/logo.png' %}" alt="All Things Equal Logo" style="height: 60px; vertical-align: middle;">
            <h1 style="margin:0; display:inline;">All Things Equal</h1>
            <nav style="margin-top: 0.5rem;">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'about' %}">About</a>
                <a href="{% url 'pricing' %}">Pricing</a>
                <a href="{% url 'reviews' %}">Reviews</a>
                <a href="{% url 'quote' %}">Request Quote</a>
            </nav>
        </div>
        <div>
            <a href="/admin/" class="btn" style="background:#5d1887; margin:0;">Create Account / Sign In</a>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
